<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KA Event &amp; Design</title>
  <link rel="icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="home">

  <main class="home-wrap">
    <img src="images/logo-mark.png" alt="KA Event &amp; Design" class="logo">

    <button type="button" class="home-cta" id="btnRequest">Request a quote</button>

    <nav class="social" aria-label="Contact">
      <a class="social-link"
         href="https://api.whatsapp.com/send?phone=50255171700"
         target="_blank" rel="noopener" aria-label="WhatsApp">

        </svg>
      </a>

      <a class="social-link"
         href="https://www.instagram.com/kaevents_/"
         target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 2.16c3.2 0 3.58.01 4.85.07 1.17.05 1.8.25 2.23.41.56.22.96.48 1.38.9.42.42.68.82.9 1.38.16.42.36 1.06.41 2.23.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.25 1.8-.41 2.23-.22.56-.48.96-.9 1.38-.42.42-.82.68-1.38.9-.42.16-1.06.36-2.23.41-1.27.06-1.65.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.8-.25-2.23-.41-.56-.22-.96-.48-1.38-.9-.42-.42-.68-.82-.9-1.38-.16-.42-.36-1.06-.41-2.23-.06-1.27-.07-1.65-.07-4.85s.01-3.58.07-4.85c.05-1.17.25-1.8.41-2.23.22-.56.48-.96.9-1.38.42-.42.82-.68 1.38-.9.42-.16 1.06-.36 2.23-.41 1.27-.06 1.65-.07 4.85-.07M12 0C8.74 0 8.33.01 7.05.07 5.78.13 4.9.33 4.14.63c-.79.31-1.46.72-2.13 1.38C1.35 2.68.94 3.35.63 4.14.33 4.9.13 5.78.07 7.05.01 8.33 0 8.74 0 12s.01 3.67.07 4.95c.06 1.27.26 2.15.56 2.91.31.79.72 1.46 1.38 2.13.67.67 1.34 1.08 2.13 1.38.76.3 1.64.5 2.91.56C8.33 23.99 8.74 24 12 24s3.67-.01 4.95-.07c1.27-.06 2.15-.26 2.91-.56.79-.31 1.46-.72 2.13-1.38.67-.67 1.08-1.34 1.38-2.13.3-.76.5-1.64.56-2.91.06-1.28.07-1.69.07-4.95s-.01-3.67-.07-4.95c-.06-1.27-.26-2.15-.56-2.91-.31-.79-.72-1.46-1.38-2.13C21.32 1.35 20.65.94 19.86.63 19.1.33 18.22.13 16.95.07 15.67.01 15.26 0 12 0z"/>
          <path d="M12 5.84a6.16 6.16 0 1 0 0 12.32 6.16 6.16 0 0 0 0-12.32zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/>
          <circle cx="18.41" cy="5.59" r="1.44"/>
        </svg>
      </a>
    </nav>

    <button type="button" class="link-btn home-enter" id="btnEnter">Enter</button>
  </main>

  <!-- Quote request, sent to WhatsApp -->
  <div class="modal" id="requestModal" aria-hidden="true">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="requestTitle">
      <button type="button" class="modal-close" id="btnRequestClose" aria-label="Close">&times;</button>

      <h2 class="modal-title" id="requestTitle">Request a quote</h2>
      <p class="modal-sub">We reply on WhatsApp</p>

      <form id="requestForm" class="request-form" novalidate>
        <label class="field">
          <span class="label">Name</span>
          <input type="text" id="rName" class="input" autocomplete="name" required>
        </label>

        <label class="field">
          <span class="label">Type of event</span>
          <input type="text" id="rType" class="input"
                 placeholder="Wedding, birthday, baptism…" required>
        </label>

        <label class="field">
          <span class="label">Event date <span class="opt">(optional)</span></span>
          <input type="date" id="rDate" class="input">
        </label>

        <p class="error" id="requestError" role="alert"></p>

        <button type="submit" class="btn btn-block">Send on WhatsApp</button>
      </form>
    </div>
  </div>

  <!-- Access code modal -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button type="button" class="modal-close" id="btnClose" aria-label="Close">&times;</button>

      <h2 class="modal-title" id="modalTitle">Access code</h2>
      <p class="modal-sub">Enter the code to continue</p>

      <form id="codeForm" autocomplete="off">
        <input type="password" id="codeInput" class="input code-input" placeholder="••••••••" required>
        <p class="error" id="codeError" role="alert"></p>
        <button type="submit" class="btn btn-block">Continue</button>
      </form>
    </div>
  </div>

  <script src="js/home.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
